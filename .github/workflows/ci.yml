name: ci

on:
  push:
    branches:
      - main
      - "**-rc.**"
      - "renovate/**"
  pull_request:
    branches:
      - main

jobs:
  email-build-pipeline:
    name: Email build pipeline (${{ matrix.nuxt }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        nuxt: ['4.6.4']
        modes: ['development,production,prerender']
        include:
          # Lowest supported version. Its prerendering fails without this module too.
          - os: ubuntu-latest
            nuxt: '4.1.0'
            modes: 'development,production'
          - os: windows-latest
            nuxt: '4.6.4'
            modes: 'development,production,prerender'
    steps:
      - uses: actions/checkout@v5
      # setup-node caches the packageManager from package.json, so pnpm must exist first.
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:compatibility
        env:
          EMAIL_TEST_NUXT: ${{ matrix.nuxt }}
          EMAIL_TEST_MODES: ${{ matrix.modes }}

  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: lts/-1
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright
        run: pnpm playwright-core install

      - run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: "Report Coverage"
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Build
        run: pnpm build
